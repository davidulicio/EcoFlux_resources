name: Carbonique integration checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carbonique-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py collectstatic --noinput
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test hub
  legacy-site-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-legacy-tests.txt
      - run: python manage.py test inventory --settings=EcoFlux.test_settings
